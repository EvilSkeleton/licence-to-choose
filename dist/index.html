<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Licence to Choose</title>
<meta name="description" content="An interactive spy thriller: pick your moves, beat the clock, and name the traitor.">
<meta name="theme-color" content="#e6d9bc">
<meta property="og:title" content="Licence to Choose">
<meta property="og:description" content="An interactive spy thriller: pick your moves, beat the clock, and name the traitor.">
<meta property="og:type" content="website">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=Special+Elite&display=swap">
<style>
/* Layout: cinematic film still on top of each case sheet, Bond's notebook + clock on the right (stacks on phones). */
:root{
  --bg:#e6d9bc; --paper:#f7f1e3; --ink:#1b2130; --muted:#5f5a4c; --line:#cbb98f;
  --accent:#9b1f1f; --brass:#8a6a1c; --good:#2d6a3b;
  --tint:rgba(155,31,31,.08); --brass-tint:rgba(138,106,28,.12);
  --font-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-type:'Special Elite','Courier New',Courier,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e131b; --paper:#161d28; --ink:#ebe4d2; --muted:#9ea3ab; --line:#2b3546;
    --accent:#e0554a; --brass:#d4ad5c; --good:#74c486;
    --tint:rgba(224,85,74,.12); --brass-tint:rgba(212,173,92,.14); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131b; --paper:#161d28; --ink:#ebe4d2; --muted:#9ea3ab; --line:#2b3546;
  --accent:#e0554a; --brass:#d4ad5c; --good:#74c486;
  --tint:rgba(224,85,74,.12); --brass-tint:rgba(212,173,92,.14); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55}
.app{max-width:1100px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand b{font-family:var(--font-display);font-weight:900;font-size:1.6rem;letter-spacing:.04em;text-transform:uppercase}
.brand b span{color:var(--accent)}
.brand small{font-family:var(--font-type);color:var(--muted);font-size:.9rem}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.ghost{font:500 .85rem var(--font-body);background:transparent;color:var(--ink);border:1px solid var(--line);padding:6px 12px;cursor:pointer}
.ghost:hover{border-color:var(--ink)}
.ghost[aria-pressed="false"]{opacity:.55;text-decoration:line-through}

/* film stills */
.still{position:relative;overflow:hidden;background:#05070b;aspect-ratio:800/260;max-width:100%}
.still svg{display:block;width:100%;height:100%}
.still .kb{transform-origin:60% 50%;animation:kb 14s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
.still::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.alarm{animation:alarm 1.1s ease-in-out infinite}
@keyframes alarm{50%{opacity:.15}}
.blink{animation:alarm 2.4s ease-in-out infinite}

/* intro clip */
.cinema{background:#000;color:#f3ead2;display:grid;gap:0;box-shadow:0 20px 40px -20px rgba(0,0,0,.6)}
.screen{position:relative;aspect-ratio:16/9;overflow:hidden;background:#000;max-width:100%}
.screen .still{position:absolute;inset:11% 0;aspect-ratio:auto}
.screen .still svg{height:100%}
.bars{position:absolute;inset:0;pointer-events:none;border-top:solid #000;border-bottom:solid #000;border-width:clamp(18px,5.5vw,60px) 0}
.cap{position:absolute;top:calc(clamp(18px,5.5vw,60px) + 10px);left:16px;font-family:var(--font-type);font-size:clamp(.7rem,1.6vw,.95rem);letter-spacing:.14em;color:#e6c477;background:rgba(0,0,0,.7);padding:2px 8px;animation:fade 1s ease both}
.subs{position:absolute;left:50%;bottom:calc(clamp(18px,5.5vw,60px) + 12px);transform:translateX(-50%);width:min(92%,860px);text-align:center;animation:fade .5s ease both}
.subs .who{display:table;margin:0 auto 4px;background:rgba(0,0,0,.8);padding:1px 8px;font-family:var(--font-display);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:clamp(.8rem,1.7vw,1.05rem);color:#e6c477}
.subs .line{display:inline;background:rgba(0,0,0,.72);padding:2px 8px;font-size:clamp(.95rem,2.3vw,1.4rem);line-height:1.6;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#fff}
@keyframes fade{from{opacity:0}to{opacity:1}}
.titlecard{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;animation:fade 1.2s ease both}
.titlecard h1{color:#f3ead2;font-size:clamp(2.4rem,9vw,6.2rem)}
.titlecard h1 span{color:#d24a3c}
.titlecard p{font-family:var(--font-type);color:#d8b768;letter-spacing:.14em;margin:8px 0 0;font-size:clamp(.8rem,2vw,1.1rem)}
.cine-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;background:#0b0d12;border-top:1px solid #222}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:4px;background:#333}
.dots i.on{background:#d8b768}
.cine-btn{font:700 .85rem var(--font-body);letter-spacing:.08em;text-transform:uppercase;background:transparent;color:#f3ead2;border:1px solid #555;padding:8px 14px;cursor:pointer}
.cine-btn:hover{border-color:#d8b768;color:#d8b768}
.cine-btn.main{background:#d8b768;color:#111;border-color:#d8b768}

/* desk */
.desk{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}
.sheet{position:relative;background:var(--paper);border:1px solid var(--line);display:grid;box-shadow:0 12px 28px -18px rgba(0,0,0,.35);min-width:0}
.inner{padding:22px 28px 28px;display:grid;gap:14px}
.stamp{position:absolute;top:14px;right:16px;z-index:2;font-family:var(--font-type);color:#f3ead2;background:rgba(155,31,31,.85);padding:3px 10px;transform:rotate(3deg);font-size:.82rem;letter-spacing:.12em}
.eyebrow{font-family:var(--font-type);font-size:.88rem;color:var(--muted)}
h1,h2{font-family:var(--font-display);font-weight:900;text-transform:uppercase;letter-spacing:.02em;line-height:.95;margin:0;text-wrap:balance}
h1{font-size:clamp(2.4rem,7vw,5rem)} h1 span{color:var(--accent)}
h2{font-size:clamp(1.7rem,4vw,2.5rem)}
.story{max-width:65ch;font-size:1.1rem;margin:0}
.quote{margin:0;padding:10px 16px;border-left:3px solid var(--ink);font-family:var(--font-type);font-size:1.04rem;max-width:62ch}
.quote cite{display:block;font-style:normal;font-family:var(--font-body);font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px}
.found{border:1px solid var(--accent);background:var(--tint);padding:12px 16px;font-family:var(--font-type);animation:slam .35s ease-out}
.found small{display:block;font-family:var(--font-body);font-weight:600;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.nothing{border:1px dashed var(--line);padding:10px 14px;color:var(--muted)}
@keyframes slam{0%{transform:scale(1.05);opacity:0}100%{transform:none;opacity:1}}
.label{font-family:var(--font-type);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.label em{font-style:normal;color:var(--accent)}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;text-align:left;cursor:pointer;background:transparent;color:var(--ink);padding:12px 16px;font:inherit;border:2px solid var(--ink);transition:transform .12s ease,background .12s ease}
.opt:hover{transform:translateX(4px);background:var(--brass-tint)}
.opt.ask{border-style:dashed;border-color:var(--brass)}
.opt .k{grid-row:span 2;font-family:var(--font-display);font-weight:900;font-size:1.5rem;width:38px;height:38px;display:grid;place-items:center;border:2px solid currentColor}
.opt .t{font-weight:600;font-size:1.04rem;line-height:1.3}
.opt .s{font-size:.85rem;color:var(--muted)}
.opt .h{grid-row:span 2;font-weight:600;font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.go{font:700 1rem var(--font-body);text-transform:uppercase;letter-spacing:.06em;background:var(--ink);color:var(--paper);border:0;padding:12px 22px;cursor:pointer}
.go:hover{background:var(--accent)}
.go:disabled{opacity:.4;cursor:not-allowed;background:var(--ink)}
.go.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.warn{background:var(--accent);color:var(--paper);padding:10px 14px;font-weight:600}

/* notebook */
.notebook{background:var(--paper);border:1px solid var(--line);padding:16px;display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.clock{display:grid;gap:6px}
.clock b{font-family:var(--font-display);font-weight:900;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.clock.low b{color:var(--accent)}
.clockbar{height:8px;background:var(--line)}
.clockbar i{display:block;height:100%;background:var(--ink);transition:width .6s ease}
.clock.low .clockbar i{background:var(--accent)}
.notebook h3{margin:0;font-family:var(--font-display);font-weight:800;font-size:1.25rem;text-transform:uppercase;letter-spacing:.05em}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.notes li{font-family:var(--font-type);font-size:.88rem;border-left:3px solid var(--accent);padding:3px 0 3px 10px}
.notes li b{display:block;font-family:var(--font-body);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.notes .empty{border:0;padding:0;color:var(--muted);font-family:var(--font-body)}
.trail{display:flex;flex-wrap:wrap;gap:4px;font-size:.8rem;color:var(--muted)}
.trail span::after{content:' →'} .trail span:last-child::after{content:''}

/* accusation */
.pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sus{text-align:left;cursor:pointer;background:transparent;color:var(--ink);border:2px solid var(--line);padding:10px 12px;font:inherit;display:grid;gap:2px;min-width:0}
.sus b{font-family:var(--font-display);font-weight:800;font-size:1.2rem;text-transform:uppercase;letter-spacing:.03em}
.sus span{font-size:.82rem;color:var(--muted)}
.sus[aria-pressed="true"]{border-color:var(--accent);background:var(--tint)}
.ev{display:grid;gap:8px}
.evc{text-align:left;cursor:pointer;background:transparent;color:var(--ink);border:2px solid var(--line);padding:10px 12px;font:inherit;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.evc .box{width:22px;height:22px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700}
.evc[aria-pressed="true"]{border-color:var(--brass);background:var(--brass-tint)}
.evc span.txt{font-family:var(--font-type);font-size:.95rem}
.evc span.txt b{display:block;font-family:var(--font-body);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}

/* ending */
.ending-kicker{font-family:var(--font-type);color:var(--accent)}
.evidence{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.evidence li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:.95rem}
.tag{font-size:.72rem;font-weight:600;padding:2px 8px;border:1px solid currentColor;white-space:nowrap}
.tag.k{color:var(--good)} .tag.r{color:var(--accent)} .tag.n{color:var(--muted)}
.map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;min-width:560px}
.mapwrap{overflow-x:auto}
.col{display:grid;gap:6px;align-content:start}
.col .head{font-family:var(--font-type);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.node{border:1px dashed var(--line);padding:7px 8px;font-size:.84rem;color:var(--muted)}
.node.v{border:2px solid var(--ink);color:var(--ink);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{border-left:3px solid var(--ink);padding-left:12px}
.stat b{display:block;font-family:var(--font-display);font-weight:900;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.84rem;color:var(--muted)}
.theory{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.theory article{border:1px solid var(--line);padding:16px;min-width:0;display:grid;gap:8px;align-content:start}
.theory h3{margin:0;font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:1.3rem}
.theory p{margin:0;font-size:.95rem}
.mda{width:100%;border-collapse:collapse;font-size:.9rem}
.mda th,.mda td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.mda th{font-family:var(--font-type);font-weight:400;color:var(--accent);white-space:nowrap}
.cast{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cast div{border-top:3px solid var(--ink);padding-top:8px;font-size:.95rem;min-width:0}
.cast b{display:block;font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:1.15rem;letter-spacing:.03em}
.rules{margin:0;padding-left:20px;display:grid;gap:4px;max-width:70ch}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (max-width:860px){
  .desk{grid-template-columns:1fr}
  .notebook{position:static}
  .theory,.cast{grid-template-columns:1fr}
  .pick,.stats{grid-template-columns:1fr 1fr}
  .inner{padding:18px 16px 22px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* =====================================================================
   CASE DATA
   pts = which suspects a clue points to. [] = points to nobody.
   ===================================================================== */
const START_HOURS = 24;
const CLUES = {
  mcode:   {pts:['m'], name:'Keypad log', text:"The vault was opened at 02:14 with M's personal code.",
            real:"Crane, as M's chief of staff, knew her code and used it to frame her."},
  cuff:    {pts:['crane'], name:'Cufflink', text:'A gold cufflink by the vault door, engraved "E.C."',
            real:"Edmund Crane's cufflink. It came off when he crouched at the vault."},
  tap:     {pts:['crane'], name:'Night guard', text:'The guard heard slow footsteps and a tapping sound, like a walking stick.',
            real:"Crane's silver-topped cane."},
  calls:   {pts:['crane','m'], name:'Phone records', text:"Kael's casino phoned a private line on MI6's 4th floor four times. Only M and Crane have offices there.",
            real:"It was Crane's line. On its own, it can't tell M and Crane apart."},
  keyinfo: {pts:['crane','m'], name:"Q's warning", text:"Only three people know the vault code: M, Crane and Q. Q was in Geneva that night.",
            real:"That leaves M or Crane. It narrows the field but doesn't decide it."},
  elenacall:{pts:['elena'], name:'Flight bookings', text:'Elena Voss booked three one-way flights out of Monaco this week.',
            real:"She was planning to run from Kael, not to sell the key. A red herring."},
  bin:     {pts:['crane'], name:"Crane's bin", text:'A shredded bank letter addressed to "E.C. Holdings Ltd".',
            real:"Crane's private company. This is where Kael's money went."},
  diary:   {pts:['crane'], name:"Crane's diary", text:'"Lunch, Monte Carlo" written two weeks before the theft.',
            real:"Crane met Kael in Monaco to agree the sale."},
  buyer:   {pts:['crane','m'], name:"Kael's boast", text:'"I only bought it, Mr Bond. The seller is British, and very senior."',
            real:"Rules Kael out as the thief and points high up inside MI6."},
  elenamoney:{pts:['elena'], name:"Kael's accusation", text:'Kael says Elena has been skimming his money for months.',
            real:"True, but she was saving to escape him. A red herring."},
  ledger:  {pts:['crane'], name:"Elena's ledger", text:'£2 million paid to "E.C. Holdings", London.',
            real:"The payment for the key, sent to Crane's company."},
  escape:  {pts:[], name:"Elena's story", text:'"I took his money so I could disappear. He would kill me if he knew."',
            real:"Explains Elena's flights and the missing money. Clears her."},
  cane:    {pts:['crane'], name:"Kael's slip", text:'"The man who sold me your key walks with a silver-topped cane."',
            real:"Only one person in this story carries a silver-topped cane: Crane."},
  witness: {pts:['crane'], name:'Witness', text:'Kael, under arrest, names his seller: "Ask your chief of staff."',
            real:"A direct statement against Crane."}
};

const SUSPECTS = {
  kael:{name:'Viktor Kael', note:'Arms dealer, Monaco'},
  elena:{name:'Elena Voss', note:"Kael's accountant"},
  crane:{name:'Sir Edmund Crane', note:"M's chief of staff"},
  m:{name:'M', note:'Head of MI6'}
};

/* hours: travel cost. Each "ask" costs 2 hours. */
const SCENES = {
  brief:{ city:'London', art:'office', place:"MI6 · M's office", title:'Where do you start?',
    text:"M has given you the case. Crane wants you on the next plane to Monaco. You have 24 hours before the key is sold on.",
    speaker:'M', quote:"Follow the evidence, 007. Not the obvious answer.",
    go:[ {t:'Inspect the vault', s:'Where the key was stolen', to:'vault', h:1},
         {t:"Visit Q Branch", s:'Ask Q to run traces', to:'qlab', h:1},
         {t:'Fly to Monaco now', s:"Go after Kael, as Crane says", to:'casino', h:6} ]},
  vault:{ city:'London', art:'vault', place:'MI6 · Vault level', title:'The Vault',
    text:"The steel door wasn't forced. Someone opened it. The night guard is still on duty, looking nervous.",
    ask:[ {t:'Check the keypad log', clue:'mcode', reply:"The screen shows the time and the code used."},
          {t:'Search the floor by the door', clue:'cuff', reply:"Something small has rolled under the door frame."},
          {t:'Question the night guard', clue:'tap', speaker:'Night guard', reply:"I didn't see anyone, sir. But I heard someone. Slow steps... and tapping."} ],
    go:[ {t:'Go to Q Branch', s:'Two floors up', to:'qlab', h:1},
         {t:"Search Crane's office while he's out", s:'Risky. He is your superior.', to:'crane', h:1},
         {t:'Fly to Monaco', s:"Kael's casino", to:'casino', h:6},
         {t:'Report to M and accuse', s:'End the investigation', to:'accuse', h:0} ]},
  qlab:{ city:'London', art:'qlab', place:'MI6 · Q Branch', title:"Q's Lab",
    text:"Q has every screen running. \"I can run one trace for you before the brass notices, 007. Choose carefully.\"",
    ask:[ {t:"Trace Kael's phone calls", clue:'calls', reply:"Q frowns at the screen. \"That's... one of ours.\""},
          {t:"Trace Elena Voss's bookings", clue:'elenacall', reply:"\"His accountant has been busy at the travel agent.\""},
          {t:'Ask Q who knows the vault code', clue:'keyinfo', speaker:'Q', reply:"Only three people know it, 007. M, Crane and me. And I was in Geneva."} ],
    go:[ {t:"Search Crane's office while he's out", s:'Risky. He is your superior.', to:'crane', h:1},
         {t:'Go back to the vault', s:'Downstairs', to:'vault', h:1},
         {t:'Fly to Monaco: the casino', s:'Confront Kael', to:'casino', h:6},
         {t:'Fly to Monaco: the harbour', s:"Find Kael's accountant", to:'harbour', h:6},
         {t:'Report to M and accuse', s:'End the investigation', to:'accuse', h:0} ]},
  crane:{ city:'London', art:'craneoffice', place:"MI6 · Crane's office", title:"Crane's Office",
    text:"Crane is in a meeting. His office is neat, almost too neat. You'll only have time to check one thing before he's back.",
    ask:[ {t:'Go through his bin', clue:'bin', reply:"Strips of paper. You piece a few together."},
          {t:'Read his desk diary', clue:'diary', reply:"Mostly meetings. One entry stands out."},
          {t:'Look at the photos on his wall', clue:null, reply:"Crane with ministers, Crane with M at a gala, Crane holding a trophy. Nothing useful, and footsteps are coming."} ],
    go:[ {t:'Slip out to Q Branch', s:'Before Crane comes back', to:'qlab', h:1},
         {t:'Fly to Monaco: the casino', s:'Confront Kael', to:'casino', h:6},
         {t:'Report to M and accuse', s:'End the investigation', to:'accuse', h:0} ]},
  casino:{ city:'Monaco', art:'casino', place:'Monte Carlo · Casino', title:'The Casino',
    text:"Kael is at the high-stakes table, bodyguards all around him. He waves you over. He'll answer one question, and only one.",
    speaker:'Viktor Kael', quote:"Ask me anything, Mr Bond. Once.",
    ask:[ {t:'"Who sold you the key?"', clue:'buyer', speaker:'Viktor Kael', reply:"Steal it? I don't steal, Mr Bond. I buy."},
          {t:'"Where is the key now?"', clue:null, speaker:'Viktor Kael', reply:"Somewhere you'll never reach. Next question. Oh, sorry, that was your only one."},
          {t:'"What do you know about Elena Voss?"', clue:'elenamoney', speaker:'Viktor Kael', reply:"My accountant? Clever girl. A little too clever with my money."} ],
    go:[ {t:"Follow Kael's accountant to the harbour", s:'She just slipped out', to:'harbour', h:1},
         {t:"Accept Kael's invitation to his yacht", s:"Walk into the lion's den", to:'yacht', h:2},
         {t:'Fly back to London and accuse', s:'End the investigation', to:'accuse', h:6} ]},

let AC = null, MASTER = null, MUSICBUS = null, FXBUS = null;
function ctx(){
  try{
    if(!AC){ AC = new (window.AudioContext||window.webkitAudioContext)();

function noise(t, dur, vol, bus, freq=8000, type='highpass'){

const SCORE = {

}
function musicTick(){
  while(MUSIC.next < AC.currentTime + .15){
    const t = MUSIC.next, i = MUSIC.i, st = SCORE.step;

    if(b){ note('triangle', b, t, st*1.6, .5, MUSICBUS, {lp:900}); note('sine', b-12, t, st*1.6, .35, MUSICBUS); }

};
function voiceFor(who){
  const c = CAST[who] || CAST.Narrator;
  const en = VOICES.filter(v=>/^en/i.test(v.lang));
  const gb = en.filter(v=>/GB|UK|United Kingdom/i.test(v.lang+v.name));
  const isF = v => /female|hazel|susan|libby|sonia|maisie|kate|serena|zira|aria|jenny|samantha|karen|moira|tessa|fiona/i.test(v.name);
  const pool = (gb.length?gb:en);
  const bySex = pool.filter(v => c.sex==='f' ? isF(v) : !isF(v));
  const list = bySex.length ? bySex : pool;
  return list.length ? list[(c.pick||0) % list.length] : null;
}
let speakToken = 0;
function speak(who, text, done){
  const token = ++speakToken;
  const finish = () => { if(token===speakToken){ duck(false); done && done(); } };
  if(!AUDIO.voice || !TTS || !text){ setTimeout(finish, Math.max(2200, text ? text.split(' ').length*330+900 : 1500)); return; }
  try{
    TTS.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[“”"]/g,''));
    const c = CAST[who] || CAST.Narrator, v = voiceFor(who);
    if(v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';
    u.pitch = c.pitch; u.rate = c.rate;
    let ended = false;
    u.onend = u.onerror = () => { if(!ended){ ended = true; setTimeout(finish, 450); } };
    duck(true); TTS.speak(u);
    setTimeout(()=>{ if(!ended){ ended = true; finish(); } }, text.split(' ').length*520 + 3500);
  }catch(e){ setTimeout(finish, 2500); }
}
function hush(){ speakToken++; try{ TTS && TTS.cancel(); }catch(e){} duck(false); }

/* =====================================================================
   INTRO CLIP
   ===================================================================== */
const SHOTS = [
  {art:'london', cap:'LONDON · 02:14', who:'Narrator', line:"London. Three nights ago. Fourteen minutes past two in the morning."},
  {art:'vault', cap:'MI6 · VAULT LEVEL -4', who:'Narrator', line:"Someone opened the MI6 vault and walked out with the launch key for Project Halo, Britain's spy satellite."},
  {art:'office', cap:"M'S OFFICE · 08:00", who:'M', line:"Whoever holds that key can blind every British satellite in the sky. I want it back, 007. And I want to know who took it."},
  {art:'office', cap:"M'S OFFICE · 08:00", who:'Sir Edmund Crane', line:"It's obviously Viktor Kael. Arms dealer. Runs a casino in Monte Carlo. Get on a plane tonight, 007. There's no need to waste time here."},
  {art:'casino', cap:'MONTE CARLO', who:'Narrator', line:"Viktor Kael. He buys and sells anything that can start a war."},
  {art:'harbour', cap:'MONTE CARLO · HARBOUR', who:'Narrator', line:"His accountant, Elena Voss, knows where every penny goes. Lately, she looks ready to run."},
  {art:'office', cap:"M'S OFFICE · 08:05", who:'M', line:"You have twenty-four hours before the key is sold on. Follow the evidence, 007. Not the obvious answer."},
  {art:'title', title:true}
];
let introI = 0, introTimer = null;
function introPlay(i){
  introI = i; clearTimeout(introTimer); hush();
  render();
  const sh = SHOTS[i];
  if(sh.title){ FX.sting(); return; }
  FX.whoosh();
  introTimer = setTimeout(()=>speak(sh.who, sh.line, ()=>{ if(S.screen==='intro' && introI===i) introPlay(i+1); }), 700);
}
function introSkip(){ clearTimeout(introTimer); hush(); introPlay(SHOTS.length-1); }

/* =====================================================================
   GAME STATE
   ===================================================================== */
function fresh(){ return { screen:'title', scene:'brief', hours:START_HOURS, clues:[], asked:{}, path:['brief'], kaelDead:false,
  last:null, suspect:null, picked:[], timeUp:false, accused:null } }
let S = fresh();

function spend(h){ if(h>0){ S.hours = Math.max(0, S.hours - h); FX.tick(); } }
function travel(i){
  const g = SCENES[S.scene].go[i]; if(!g) return;
  hush(); spend(g.h);
  let to = g.to;
  if(S.hours<=0 && to!=='accuse'){ to = 'accuse'; S.timeUp = true; }
  S.scene = to; S.path.push(to); S.last = null;
  if(to==='yacht') spend(3);
  FX.whoosh(); render(); window.scrollTo({top:0,behavior:'smooth'});
  const sc = SCENES[to];
  if(sc.quote) setTimeout(()=>speak(sc.speaker, sc.quote), 500);
}
function ask(i){
  const sc = SCENES[S.scene], a = sc.ask[i];
  if(!a || S.asked[S.scene]!==undefined) return;
  hush();
  S.asked[S.scene] = i;
  spend(S.scene==='island' ? 0 : 2);
  if(S.scene==='yacht' && i===2) spend(1);
  if(a.fx==='boom'){ S.kaelDead = true; FX.boom(); }
  let got = null;
  if(a.clue && !S.clues.includes(a.clue)){ S.clues.push(a.clue); got = a.clue; setTimeout(FX.clue, a.fx==='boom'?900:250); }
  S.last = {reply:a.reply, speaker:a.speaker, clue:a.clue};
  if(S.hours<=0 && S.scene!=='island'){ S.timeUp = true; }
  render();
  const say = a.speaker ? (a.reply + (a.clue && CLUES[a.clue].text.startsWith('"') ? ' ' + CLUES[a.clue].text : '')) : null;
  if(say) speak(a.speaker, say);
}
function forceAccuse(){ S.scene='accuse'; S.path.push('accuse'); S.last=null; FX.stamp(); render(); }

function verdict(){
  const x = S.suspect, sel = S.picked;
  const need = Math.min(3, S.clues.length);
  const all = sel.length===3 && sel.every(c=>CLUES[c].pts.includes(x));
  const unique = sel.some(c=>CLUES[c].pts.length===1 && CLUES[c].pts[0]===x);
  return {strong: all && unique, all, need};
}
function accuse(){
  S.accused = S.suspect; S.screen = 'ending'; hush(); FX.stamp(); setTimeout(FX.sting, 300);
  render(); window.scrollTo({top:0,behavior:'smooth'});
  const e = endingInfo(); setTimeout(()=>speak(e.quote[0], e.quote[1]), 1200);
}

/* =====================================================================
   VIEWS
   ===================================================================== */
function header(){
  const tg = (k,l) => `<button class="ghost" data-a="tog" data-k="${k}" aria-pressed="${AUDIO[k]}">${l}</button>`;
  return `<header class="top"><div class="brand"><b>Licence <span>to</span> Choose</b><small>Case file 007 · Operation Black Halo</small></div>
    <div class="tools">${tg('music','Music')}${tg('voice','Voices')}${tg('sfx','Effects')}
    ${S.screen!=='title'?'<button class="ghost" data-a="restart">Start over</button>':''}</div></header>`;
}
function titleView(){
  return `<section class="sheet"><div class="still">${art('london')}</div><span class="stamp">TOP SECRET</span>
    <div class="inner">
    <div class="eyebrow">MI6 · Case file 007</div>
    <h1>Licence <span>to</span> Choose</h1>
    <p class="story">You are James Bond. The launch key for Britain's spy satellite has been stolen. You have 24 hours, one question per place, and a notebook. Not every clue tells the truth.</p>
    <ul class="rules">
      <li><b>Travel costs hours.</b> London to Monaco is 6 hours. You can't go everywhere.</li>
      <li><b>One question per place.</b> Each costs 2 hours. Pick the wrong one and you learn little, or something misleading.</li>
      <li><b>Some clues are red herrings.</b> Your notebook doesn't tell you which.</li>
      <li><b>To win,</b> accuse the right suspect and back it with exactly 3 clues that all point to them, including at least one that points <i>only</i> to them.</li>
      <li>If the clock hits zero, M calls you back to accuse with whatever you have.</li>
    </ul>
    <div class="row"><button class="go" data-a="intro">Play the briefing film</button><button class="go alt" data-a="skipstart">Skip to the case</button></div>
    <p class="eyebrow">Sound on for music and voices. Subtitles always show.</p>
    </div></section>`;
}
function introView(){
  const sh = SHOTS[introI];
  const inner = sh.title
    ? `<div class="titlecard"><div><h1>Licence <span>to</span> Choose</h1><p>24 HOURS · 4 SUSPECTS · 1 TRUTH</p></div></div>`
    : `<div class="cap">${sh.cap}</div><div class="subs"><span class="who">${sh.who}</span><span class="line">${sh.line}</span></div>`;
  return `<section class="cinema">
    <div class="screen"><div class="still">${art(sh.art)}</div><div class="bars"></div>${inner}</div>
    <div class="cine-bar"><div class="dots">${SHOTS.map((_,i)=>`<i class="${i<=introI?'on':''}"></i>`).join('')}</div>
      <div class="row">${sh.title?`<button class="cine-btn" data-a="replay">Watch again</button><button class="cine-btn main" data-a="begin">Begin the investigation</button>`:`<button class="cine-btn" data-a="skip">Skip</button>`}</div></div>
  </section>`;
}
function notebook(){
  const low = S.hours<=6;
  return `<aside class="notebook">
    <div class="clock ${low?'low':''}"><span class="label">Time left</span><b>${S.hours}h</b><div class="clockbar"><i style="width:${S.hours/START_HOURS*100}%"></i></div></div>
    <h3>Bond's notebook</h3>
    <ul class="notes">${S.clues.length?S.clues.map(c=>`<li><b>${CLUES[c].name}</b>${CLUES[c].text}</li>`).join(''):'<li class="empty">No clues yet.</li>'}</ul>
    <div><div class="label">Your route</div><div class="trail">${S.path.map(p=>`<span>${SHORT[p]}</span>`).join('')}</div></div>
  </aside>`;
}
function sceneView(){
  if(S.scene==='accuse') return accuseView();
  const sc = SCENES[S.scene], asked = S.asked[S.scene];
  let mid = '';
  if(sc.ask){
    if(asked===undefined){
      mid += `<div class="label">Investigate · <em>choose one</em>${S.scene==='island'?'':' · 2 hours'}</div>
        <div class="opts">${sc.ask.map((a,i)=>`<button class="opt ask" data-a="ask" data-i="${i}"><span class="k">${'ABC'[i]}</span><span class="t">${a.t}</span><span class="s">${S.scene==='island'?'You only get one chance':'Ask or search'}</span></button>`).join('')}</div>`;
    } else if(S.last){
      const l = S.last;
      mid += l.speaker ? `<blockquote class="quote">${l.reply}<cite>${l.speaker}</cite></blockquote>` : `<p class="story">${l.reply}</p>`;
      mid += l.clue ? `<div class="found"><small>Added to notebook · ${CLUES[l.clue].name}</small>${CLUES[l.clue].text}</div>` : `<div class="nothing">Nothing useful. That cost you time.</div>`;
    } else {
      mid += `<div class="nothing">You've already investigated here.</div>`;
    }
  }
  let travelBlock;
  if(S.timeUp){
    travelBlock = `<div class="warn">Time's up. The key has been sold on. M is calling you back to London to make your accusation with what you have.</div><div class="row"><button class="go" data-a="force">Go to M's office</button></div>`;
  } else {
    const locked = sc.ask && asked===undefined && S.scene==='island';
    travelBlock = locked ? '' : `<div class="label">Where next?</div><div class="opts">${sc.go.map((g,i)=>`<button class="opt" data-a="go" data-i="${i}"><span class="k">${i+1}</span><span class="t">${g.t}</span><span class="s">${g.s}</span><span class="h">${g.h?'−'+g.h+'h':'0h'}</span></button>`).join('')}</div>`;
  }
  return `<div class="desk"><section class="sheet">
    <div class="still">${art(sc.art)}</div><span class="stamp">${sc.city.toUpperCase()}</span>
    <div class="inner">
      <div class="eyebrow">${sc.place}</div>
      <h2>${sc.title}</h2>
      <p class="story">${sc.text}</p>
      ${sc.quote && asked===undefined ? `<blockquote class="quote">${sc.quote}<cite>${sc.speaker}</cite></blockquote>` : ''}
      ${mid}
      ${travelBlock}
    </div></section>${notebook()}</div>`;
}
function accuseView(){
  const need = Math.min(3, S.clues.length);
  const ready = S.suspect && S.picked.length===need;
  return `<div class="desk"><section class="sheet">
    <div class="still">${art('accuse')}</div><span class="stamp">FINAL REPORT</span>
    <div class="inner">
      <div class="eyebrow">MI6 · M's office</div>
      <h2>The Accusation</h2>
      <p class="story">M, Crane and Q are waiting. Name the thief, then lay down ${need===3?'exactly 3 pieces':`your ${need} piece${need===1?'':'s'}`} of evidence. A strong case needs 3 clues that all point to that person, and at least one that points only to them.</p>
      <div class="label">1 · Who stole the key?</div>
      <div class="pick">${Object.entries(SUSPECTS).map(([id,p])=>`<button class="sus" data-a="sus" data-id="${id}" aria-pressed="${S.suspect===id}"><b>${p.name}</b><span>${p.note}${id==='kael'&&S.kaelDead?' · died on the island':''}</span></button>`).join('')}</div>
      <div class="label">2 · Choose your evidence (${S.picked.length}/${need})</div>
      <div class="ev">${S.clues.length?S.clues.map(c=>{const on=S.picked.includes(c);return `<button class="evc" data-a="pickev" data-id="${c}" aria-pressed="${on}"><span class="box">${on?'✓':''}</span><span class="txt"><b>${CLUES[c].name}</b>${CLUES[c].text}</span></button>`}).join(''):'<div class="nothing">Your notebook is empty. You can only accuse on a hunch.</div>'}</div>
      <div class="row"><button class="go" data-a="accuse" ${ready?'':'disabled'}>Make the accusation</button></div>
    </div></section>${notebook()}</div>`;
}
function endingInfo(){
  const v = verdict(), a = S.accused;
  if(a==='crane' && v.strong) return {win:true, kicker:'The truth', title:'Case Solved',
    text:"You lay three pieces of evidence on M's desk. Crane's hand tightens on his silver cane. E.C. Holdings is his company. He sold the key to Kael, used M's code to open the vault, and sent you to Monaco to blame the man he sold it to.",
    quote:['M',"Take him away. And 007... well done."]};
  if(a==='crane') return {kicker:'Right person, weak case', title:'He Walks Free',
    text:"You point at Crane, but your evidence doesn't hold together. Some of it points at other people too. Crane laughs it off, and M can't arrest her own chief of staff on a hunch.",
    quote:['Sir Edmund Crane',"Interesting theory, 007. Do let me know when you have proof."]};
  if(a==='m' && v.strong) return {kicker:'A perfect frame', title:'The Wrong Desk',
    text:"Your evidence looks airtight: her code opened the vault, and the calls went to her floor. M is suspended. Two weeks later, Crane is promoted to her job. Someone built this case for you to find.",
    quote:['Sir Edmund Crane',"A tragedy. Still, the service must go on."]};
  if(a==='m') return {kicker:'Close, but wrong', title:'Not M',
    text:"You accuse M. She's furious, and she has an alibi: she was in Washington the night of the theft. But someone used her code.",
    quote:['M',"Look at who has been standing next to me, 007."]};
  if(a==='kael') return {kicker:'The easy answer', title:'Case Closed?',
    text: S.kaelDead ? "You blame Viktor Kael, the man who died on the island. A neat story: foreign villain, big explosion, case closed. Crane congratulates you warmly. Too warmly."
                     : "You blame Viktor Kael. He's an arms dealer, so everyone believes it. Crane congratulates you warmly. Too warmly.",
    quote:['Sir Edmund Crane',"Splendid work, 007. Exactly as I said from the start."]};
  return {kicker:'Wrong person', title:'The Wrong Hands',
    text:"You accuse Elena Voss. Her flights and the missing money looked bad, but she was running from Kael, not selling secrets. The real thief is still inside MI6.",
    quote:['Elena Voss',"I showed you who was paid. You just didn't look."]};
}
function endingView(){
  const e = endingInfo(), vis = new Set(S.path);
  const reds = S.clues.filter(c=>!CLUES[c].pts.includes('crane')).length;
  const tagFor = c => { const p = CLUES[c].pts; if(p.length===1 && p[0]==='crane') return ['k','Real lead']; if(p.includes('crane')) return ['n','Narrows it down']; if(!p.length) return ['n','Clears someone']; return ['r','Red herring']; };
  return `<section class="sheet">
    <div class="still">${art(e.win?'london':'accuse')}</div><span class="stamp">${e.win?'CASE SOLVED':'CASE OPEN'}</span>
    <div class="inner">
    <div class="eyebrow"><span class="ending-kicker">${e.kicker}</span> · You accused ${SUSPECTS[S.accused].name}</div>
    <h1>${e.title}</h1>
    <p class="story">${e.text}</p>
    <blockquote class="quote">${e.quote[1]}<cite>${e.quote[0]}</cite></blockquote>
    <div class="stats">
      <div class="stat"><b>${START_HOURS - S.hours}h</b><span>hours used</span></div>
      <div class="stat"><b>${S.path.length-1}</b><span>places visited</span></div>
      <div class="stat"><b>${S.clues.length}</b><span>clues found</span></div>
      <div class="stat"><b>${reds}</b><span>red herrings or side leads</span></div>
    </div>
    <div><div class="label">The real culprit</div><p class="story" style="margin-top:4px">Sir Edmund Crane. As M's chief of staff he knew her vault code, opened the vault at 02:14 with his cane tapping, sold the key to Kael through his company E.C. Holdings, and pushed MI6 to blame the foreign arms dealer.</p></div>
    <div><div class="label">What your clues really meant</div>
      <ul class="evidence" style="margin-top:8px">${S.clues.length?S.clues.map(c=>{const [k,l]=tagFor(c);return `<li><span class="tag ${k}">${l}</span><span><b>${CLUES[c].name}:</b> ${CLUES[c].real}</span></li>`}).join(''):'<li>You found no clues.</li>'}</ul></div>
    <div><div class="label">Your route through the case</div>
      <div class="mapwrap" style="margin-top:8px"><div class="map">${MAPCOLS.map(([h,ids])=>`<div class="col"><div class="head">${h}</div>${ids.map(id=>`<div class="node ${vis.has(id)?'v':''}">${SHORT[id]}</div>`).join('')}</div>`).join('')}</div></div></div>
    <div class="theory">
      <article><h3>MDA framework</h3>
        <p>Hunicke, LeBlanc and Zubek split a game into three layers. Designers build the mechanics; players feel the aesthetics.</p>
        <table class="mda"><tbody>
          <tr><th>Mechanics</th><td>24-hour clock, travel costs, one question per place, red-herring clues, choosing 3 pieces of evidence.</td></tr>
          <tr><th>Dynamics</th><td>Deciding where to spend time, doubting authority (Crane), being misled, building a case.</td></tr>
          <tr><th>Aesthetics</th><td>Challenge, discovery, spy fantasy, and the shock of the twist.</td></tr>
        </tbody></table></article>
      <article><h3>Ludo hermeneutics</h3>
        <p>Meaning is made through play. The game never tells you who did it. Your notebook doesn't label which clues are true, so the story only makes sense through how you read the evidence.</p>
        <p>Two players can visit the same places and reach different conclusions. You ended with <b>${e.title}</b> because of how <i>you</i> interpreted what you found.</p>
      </article>
    </div>
    <div class="row"><button class="go" data-a="restart">Investigate again</button><button class="go alt" data-a="replay">Watch the briefing film</button></div>
    </div></section>`;
}
function render(){
  let h = header();
  if(S.screen==='title') h += titleView();
  else if(S.screen==='intro') h += introView();
  else if(S.screen==='play') h += sceneView();
  else h += endingView();
  document.getElementById('app').innerHTML = h;
}

/* =====================================================================
   EVENTS
   ===================================================================== */
function beginGame(){ hush(); clearTimeout(introTimer); S.screen='play'; S.scene='brief'; musicStart(); FX.stamp(); render(); window.scrollTo({top:0,behavior:'smooth'}); setTimeout(()=>speak('M', SCENES.brief.quote), 600); }
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-a]'); if(!b || b.disabled) return;
  const a = b.dataset.a;
  switch(a){
    case 'intro': ctx(); loadVoices(); S.screen='intro'; musicStart(); introPlay(0); break;
    case 'replay': ctx(); S = Object.assign(S.screen==='ending'?fresh():S, {screen:'intro'}); musicStart(); introPlay(0); window.scrollTo({top:0,behavior:'smooth'}); break;
    case 'skip': introSkip(); break;
    case 'skipstart': ctx(); beginGame(); break;
    case 'begin': beginGame(); break;
    case 'ask': ask(+b.dataset.i); break;
    case 'go': travel(+b.dataset.i); break;
    case 'force': forceAccuse(); break;
    case 'sus': S.suspect = b.dataset.id; FX.tick(); render(); break;
    case 'pickev': { const id=b.dataset.id, k=S.picked.indexOf(id), need=Math.min(3,S.clues.length);
      if(k>=0) S.picked.splice(k,1); else if(S.picked.length<need) S.picked.push(id); FX.tick(); render(); break; }
    case 'accuse': accuse(); break;
    case 'restart': hush(); clearTimeout(introTimer); S = fresh(); render(); window.scrollTo({top:0}); break;
    case 'tog': { const k=b.dataset.k; AUDIO[k]=!AUDIO[k];
      if(k==='music'){ if(AUDIO.music && S.screen!=='title') musicStart(); else musicStop(); }
      if(k==='voice' && !AUDIO.voice) hush();
      render(); break; }
  }
});
document.addEventListener('keydown', e=>{
  if(S.screen!=='play' || S.scene==='accuse') return;
  const sc = SCENES[S.scene], k = e.key.toLowerCase();
  if(sc.ask && S.asked[S.scene]===undefined && 'abc'.includes(k) && k.length===1){ const i='abc'.indexOf(k); if(sc.ask[i]) ask(i); return; }
  const n = parseInt(k,10);
  if(!S.timeUp && n>=1 && sc.go && n<=sc.go.length && !(S.scene==='island' && S.asked.island===undefined)) travel(n-1);
});

function start(data){ if(data && data.screen){ S = Object.assign(fresh(), data); if(S.screen==='intro') S.screen='title'; } render(); }
start({});
</script>
